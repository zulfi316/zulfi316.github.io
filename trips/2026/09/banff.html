  }
  h1,h2,h3,.display{font-family:'Fredoka',sans-serif;font-weight:600;letter-spacing:.2px}
  a{color:var(--teal-soft)}
  .wrap{max-width:820px;margin:0 auto;padding:0 16px}

  .banner{
    position:relative; overflow:hidden; margin:14px 0 8px;

  .kicker{font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--text-dim);font-weight:600}

  .banner .sub{color:var(--text-dim);font-size:.95rem}
  .countdown{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
  .cd-cell{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
    padding:10px 12px;min-width:64px;text-align:center;backdrop-filter:blur(6px)
  }
  .cd-num{font-family:'Fredoka';font-size:1.7rem;font-weight:700;line-height:1;color:var(--gold-soft)}
  .cd-lbl{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint);margin-top:4px}
  .cd-msg{margin-top:14px;font-family:'Fredoka';font-size:1.1rem;color:var(--teal-soft)}
  .wx-now{
    display:inline-flex;align-items:center;gap:8px;margin-top:14px;
    background:var(--surface);border:1px solid var(--border);border-radius:999px;
    padding:7px 14px;font-size:.9rem;font-weight:500
  }

  .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:14px}
  .brand{font-family:'Fredoka';font-weight:600;font-size:1.05rem;display:flex;align-items:center;gap:8px}
  .toggle{
    border:1px solid var(--border);background:var(--surface);color:var(--text);
    border-radius:999px;padding:8px 12px;font-size:1rem;cursor:pointer;transition:transform .2s var(--ease)
  }
  .toggle:active{transform:scale(.9)}

  /* ===== Day tabs ===== */
  .tabs{
    position:sticky;top:0;z-index:20;margin:6px -16px 0;padding:12px 16px 10px;
    display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
    background:linear-gradient(var(--bg), color-mix(in srgb, var(--bg) 82%, transparent));
    backdrop-filter:blur(10px);
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto;border:1px solid var(--border);background:var(--surface);
    border-radius:999px;padding:9px 15px;cursor:pointer;transition:all .25s var(--ease);
    text-align:center;line-height:1.15;color:var(--text-dim)
  }

  .tab .dt{font-size:.68rem;color:var(--text-faint)}
  .tab.active{background:linear-gradient(135deg,var(--teal),var(--pine));border-color:transparent;transform:translateY(-1px);box-shadow:0 6px 16px rgba(63,182,168,.35)}
  .tab.active .dow,.tab.active .dt{color:#08130f}
  .tab.today::after{content:"•";color:var(--gold);margin-left:5px}

  /* ===== Day view ===== */
  .day{padding-top:18px;animation:rise .5s var(--ease) both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .day-head{
    display:flex;align-items:flex-start;justify-content:space-between;gap:14px;

  .day-meta{color:var(--text-dim);font-size:.85rem;font-weight:600;letter-spacing:.04em}
  .wx-day{flex:0 0 auto;text-align:center;min-width:78px;background:var(--chip);border:1px solid var(--border);border-radius:var(--radius-md);padding:10px 8px}
  .wx-day .em{font-size:1.5rem;line-height:1}

  .wx-day .soon{font-size:.62rem;color:var(--text-faint);line-height:1.25;margin-top:2px}

  .desc{color:var(--text-dim);font-size:.9rem;margin-top:3px}

  .pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}

    text-decoration:none;background:var(--surface);border:1px solid var(--border);
    border-radius:999px;padding:7px 14px;font-size:.82rem;font-weight:700;
    color:var(--gold-soft);white-space:nowrap;transition:transform .2s var(--ease)
  }
  .flight-alert a:active{transform:scale(.96)}

  .navrow{display:flex;justify-content:space-between;gap:12px;margin-top:6px}
  .navbtn{
    flex:1;border:1px solid var(--border);background:var(--surface);color:var(--text);

  .navbtn:disabled{opacity:.35;cursor:default}
  .navbtn .mini{color:var(--text-faint);font-family:'Inter';font-size:.75rem;font-weight:500}

  footer{text-align:center;color:var(--text-faint);font-size:.8rem;margin-top:30px;padding:0 16px}
  footer a{color:var(--text-faint)}
  .progress{color:var(--text-dim);font-size:.8rem;text-align:center;margin-top:16px;font-weight:600;letter-spacing:.04em}
</style>

    loc:{name:"Calgary", lat:51.045, lon:-114.057},
    items:[
      {kind:"plane", time:"13:20 → 19:15", title:"Flight F8622 · YYC → YYZ", desc:"Calgary → Toronto Pearson. Boeing 737-8 MAX. Just memories (and probably sore legs).", track:"https://www.flightradar24.com/data/flights/f8622"},
    ]},
];

const ICONS={drive:"🚗",hike:"🥾",food:"🍽️",cafe:"☕",shop:"🛒",walk:"🚶",view:"🏔️",activity:"✨",tip:"💡",warning:"⚠️",decision:"🤔",gondola:"🚡",wake:"⏰",home:"🏠",plane:"✈️",stop:"⛽",lake:"🏞️"};
const TRIP_START = new Date("2026-09-26T00:00:00-06:00");
let active = 0;
// iOS Universal Links (alltrails.com/trail/* opens the AllTrails app if installed)
// fire reliably only on a same-tab navigation, so avoid target="_blank" there.
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const TRAIL_TARGET = isIOS ? "_self" : "_blank";

// ---------- Weather ----------
function wmo(code){
  const m={0:["☀️","Clear"],1:["🌤️","Mostly clear"],2:["⛅","Partly cloudy"],3:["☁️","Overcast"],
    45:["🌫️","Fog"],48:["🌫️","Rime fog"],51:["🌦️","Light drizzle"],53:["🌦️","Drizzle"],55:["🌦️","Heavy drizzle"],
    56:["🌧️","Freezing drizzle"],57:["🌧️","Freezing drizzle"],61:["🌧️","Light rain"],63:["🌧️","Rain"],65:["🌧️","Heavy rain"],
    66:["🌧️","Freezing rain"],67:["🌧️","Freezing rain"],71:["🌨️","Light snow"],73:["🌨️","Snow"],75:["❄️","Heavy snow"],
    77:["🌨️","Snow grains"],80:["🌦️","Showers"],81:["🌦️","Showers"],82:["⛈️","Heavy showers"],85:["🌨️","Snow showers"],
    86:["❄️","Snow showers"],95:["⛈️","Thunderstorm"],96:["⛈️","Storm + hail"],99:["⛈️","Storm + hail"]};
  return m[code]||["🌡️","—"];
}
async function loadWeather(){
  const lats=TRIP.map(d=>d.loc.lat).join(",");
  const lons=TRIP.map(d=>d.loc.lon).join(",");
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}`+
    `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max`+
    `&current=temperature_2m,weather_code&timezone=America%2FEdmonton&forecast_days=16`;
  try{
    const res=await fetch(url); const data=await res.json();
    const arr=Array.isArray(data)?data:[data];
    // Banner: current at basecamp (day 0 / Canmore)
    const now=arr[0]?.current;
    if(now){const [em,txt]=wmo(now.weather_code);
      document.getElementById("wxNow").innerHTML=
        `<span class="emoji">${em}</span><span>Canmore now · <b>${Math.round(now.temperature_2m)}°C</b> · ${txt}</span>`;}
    // Per-day
    TRIP.forEach((d,i)=>{
      const day=arr[i]?.daily; if(!day) return;
      const idx=day.time.indexOf(d.iso);
      d.wx = idx>=0 ? {
        code:day.weather_code[idx], hi:Math.round(day.temperature_2m_max[idx]),
        lo:Math.round(day.temperature_2m_min[idx]), pop:day.precipitation_probability_max[idx]
      } : null;
      d.wxLoaded=true;
    });
    // Update only the visible weather chip — re-rendering the whole day here
    // would replay the intro animation and look like a page refresh.
    const chip=document.querySelector("#dayView .wx-day");
    if(chip) chip.outerHTML=wxBox(TRIP[active]);
  }catch(e){
    document.getElementById("wxNow").innerHTML=`<span class="emoji">🌐</span><span>Weather unavailable offline</span>`;
  }
}

// ---------- Render ----------
function wxBox(d){
  if(!d.wxLoaded) return `<div class="wx-day pending"><div class="em">⏳</div><div class="soon">loading…</div></div>`;
  if(!d.wx) return `<div class="wx-day pending"><div class="em">🔮</div><div class="soon">forecast unlocks ~16 days out</div></div>`;
  const [em]=wmo(d.wx.code);
  return `<div class="wx-day"><div class="em">${em}</div><div class="hi">${d.wx.hi}°</div>`+
    `<div class="lo">low ${d.wx.lo}°</div>`+(d.wx.pop!=null?`<div class="pop">💧${d.wx.pop}%</div>`:``)+`</div>`;
}
function renderTabs(){
  const t=document.getElementById("tabs");
  const todayIso=new Date().toISOString().slice(0,10);
  t.innerHTML=TRIP.map((d,i)=>
    `<button class="tab ${i===active?'active':''} ${d.iso===todayIso?'today':''}" data-i="${i}">
      <span class="dow">${d.dow}</span><span class="dt">${d.date}</span></button>`).join("");
  t.querySelectorAll(".tab").forEach(b=>b.onclick=()=>select(+b.dataset.i));
  const a=t.querySelector(".tab.active"); if(a) a.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});
}
function renderDay(i){
  const d=TRIP[i];
  const items=d.items.map((it,n)=>{
    const stats=[it.dist&&`<span class="pill b">📏 ${it.dist}</span>`,it.dur&&`<span class="pill">⏱️ ${it.dur}</span>`].filter(Boolean).join("");
    const trail=it.trail?`<a class="trail" href="${it.trail}" target="${TRAIL_TARGET}" rel="noopener">🥾 AllTrails ↗</a>`:"";
    const track=it.track?`<a class="trail" href="${it.track}" target="_blank" rel="noopener">🛰️ Live status ↗</a>`:"";
    return `<div class="item ${it.kind}" style="animation-delay:${n*45}ms">
      <div class="ic">${ICONS[it.kind]||"✨"}</div>
      <div class="body">
        ${it.time?`<div class="time">${it.time}</div>`:""}
        <div class="ttl">${it.title}</div>
        ${it.desc?`<div class="desc">${it.desc}</div>`:""}
        ${stats?`<div class="pills">${stats}</div>`:""}
        ${trail}${track}
      </div></div>`;
  }).join("");
  // Flight-day callout: only when the loaded date is this day's flight day.
  const flight=d.items.find(it=>it.kind==="plane"&&it.track);
  const isToday=d.iso===new Date().toISOString().slice(0,10);
  const flightAlert=(flight&&isToday)?
    `<div class="flight-alert"><span class="fa-em">✈️</span>
       <span class="fa-txt">Flight day — safe travels!
         <span class="fa-sub">Tap for today's live departure/arrival status.</span></span>
       <a href="${flight.track}" target="_blank" rel="noopener">Live status ↗</a>
     </div>`:"";
  document.getElementById("dayView").innerHTML=
    `<div class="day" key="${i}">
      <div class="day-head">
        <div><div class="day-meta">DAY ${i+1} · ${d.dow} · ${d.date}</div>
          <h2>${d.emoji} ${d.title}</h2></div>
        ${wxBox(d)}
      </div>
      ${flightAlert}
      <div class="timeline">${items}</div>
    </div>`;
  // nav labels
  const prev=TRIP[i-1], next=TRIP[i+1];
  const pb=document.getElementById("prevBtn"), nb=document.getElementById("nextBtn");
  pb.disabled=!prev; nb.disabled=!next;
  pb.querySelector(".pdow").textContent=prev?prev.dow:"Start";
  pb.querySelector(".pdate").textContent=prev?prev.date:"";
  nb.querySelector(".ndow").textContent=next?next.dow:"End";
  nb.querySelector(".ndate").textContent=next?next.date:"";
  document.getElementById("progress").textContent=`Day ${i+1} of ${TRIP.length}`;
}
function scrollToDay(){
  // Can't anchor to the sticky tabs (they're already pinned at top:0, so
  // scrollIntoView no-ops). Instead scroll the day content into view and let
  // scroll-margin-top reserve space for the sticky bar — no offset math.
  const view=document.getElementById("dayView");
  view.style.scrollMarginTop=document.getElementById("tabs").offsetHeight+"px";
  view.scrollIntoView({behavior:"smooth",block:"start"});
}
function updateURL(){
  // Short, index-based deep link, e.g. ?i=0 for day 1. replaceState keeps
  // refresh on the same day without cluttering history.
  try{ history.replaceState(null,"","?i="+active); }catch(e){}
}
function select(i){
  active=Math.max(0,Math.min(TRIP.length-1,i));
  renderTabs(); renderDay(active); scrollToDay(); updateURL();
}

// ---------- Countdown ----------
function tick(){
  const now=new Date(), diff=TRIP_START-now;
  const cd=document.getElementById("countdown"), msg=document.getElementById("cdMsg");
  if(diff<=0){
    const end=new Date("2026-10-05T00:00:00-06:00");
    cd.style.display="none";
    msg.textContent = now<end ? "🎉 The adventure is happening RIGHT NOW!" : "🏔️ That was one for the books.";
    return;
  }
  const d=Math.floor(diff/864e5), h=Math.floor(diff/36e5)%24, m=Math.floor(diff/6e4)%60, s=Math.floor(diff/1e3)%60;
  const cell=(n,l)=>`<div class="cd-cell"><div class="cd-num">${String(n).padStart(2,"0")}</div><div class="cd-lbl">${l}</div></div>`;
  cd.innerHTML=cell(d,"days")+cell(h,"hrs")+cell(m,"min")+cell(s,"sec");
  msg.textContent=`⛰️ ${d} sleep${d===1?"":"s"} until the mountains!`;
}

// ---------- Theme ----------
const tgl=document.getElementById("themeToggle");
function setTheme(t){document.documentElement.dataset.theme=t;tgl.textContent=t==="dark"?"🌙":"☀️";localStorage.setItem("banff-theme",t);}
tgl.onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
setTheme(localStorage.getItem("banff-theme")||"dark");

// ---------- Nav + swipe ----------
document.getElementById("prevBtn").onclick=()=>select(active-1);
document.getElementById("nextBtn").onclick=()=>select(active+1);
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft")select(active-1);if(e.key==="ArrowRight")select(active+1);});
let tx=0, ty=0;
const mv=document.getElementById("dayView");
mv.addEventListener("touchstart",e=>{tx=e.changedTouches[0].clientX;ty=e.changedTouches[0].clientY;},{passive:true});
mv.addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  // Only count as a day-swipe when it's clearly horizontal: a large sideways
  // move that also dominates any vertical movement — so scrolling the list
  // (mostly vertical) never flips the day.
  if(Math.abs(dx)>90 && Math.abs(dx)>Math.abs(dy)*2) select(active+(dx<0?1:-1));
},{passive:true});

// ---------- Boot ----------
// Priority: ?i= param → today (if in trip) → day 1.
(function initDay(){
  const p=parseInt(new URLSearchParams(location.search).get("i"),10);
  if(Number.isInteger(p)&&p>=0&&p<TRIP.length){active=p;return;}
  const todayIso=new Date().toISOString().slice(0,10);
  const idx=TRIP.findIndex(d=>d.iso===todayIso);
  active=idx>=0?idx:0;
})();
renderTabs(); renderDay(active); updateURL(); tick(); setInterval(tick,1000); loadWeather();
</script>
</body>
</html>
